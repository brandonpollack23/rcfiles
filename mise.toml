# Tasks for this repo: `mise run <task>` from anywhere inside it, `mise tasks`
# to list them. Each task is an Amber script in scripts/, run from source by
# the amber that mise installs (see [tools]); its //MISE and //USAGE comments
# give its description and arguments. Every directory under dotfiles/ is a
# stow package that mirrors $HOME (dotfiles/nvim/.config/nvim -> ~/.config/nvim).

[env]
DOTFILES = "{{config_root}}/dotfiles"

# amber runs the tasks, yq reads packages.toml. `mise install` fetches both
# (install.sh does it), so no package manager has to provide them.
[tools]
yq = "4"

[tools."github:amber-lang/amber"]
version = "0.6.0-alpha"

[tools."github:amber-lang/amber".platforms]
linux-x64 = { asset_pattern = "amber-linux-gnu-x86_64.tar.xz" }
linux-arm64 = { asset_pattern = "amber-linux-gnu-aarch64.tar.xz" }
macos-x64 = { asset_pattern = "amber-macos-x86_64.tar.xz" }
macos-arm64 = { asset_pattern = "amber-macos-aarch64.tar.xz" }

[task_config]
includes = ["scripts"]

[settings]
# Tasks here prompt (sudo, the sops password, $EDITOR), so give them the
# terminal and run one at a time.
raw = true
