# Everything `mise run deps` installs, on every OS, in groups. `core` goes on
# every machine and `mac` on every Mac; deps asks which of the others to
# install and remembers the answer (`mise run deps <group>...` to change it).
#
# deps.sh reads it with yq (scripts/lib/packages.sh; mise installs yq first).
# Each package is a table of
#   desc = "..."                what it is
#   arch = "pkg" | ["a", "b"]   its name(s) on Arch (pacman or AUR), if not the key
#   arch = false                not on Arch
#   brew = "formula"            its Homebrew formula, if not the key
#   brew = false                not from Homebrew
#   cask = true | "cask"        a Homebrew cask instead (Mac only)
#   mas = <id>                  a Mac App Store app instead (Mac only; sign in first)
#   cargo = true | "crate"      a Rust crate, installed with cargo binstall everywhere
# By default the key is the name in Homebrew (the Mac, Debian and Fedora) and on
# Arch (through yay or paru). Formulae from other taps are named
# "<user>/<tap>/<formula>"; brew taps them. mise itself comes from install.sh.

# The groups, in the order deps asks about them.
[groups]
core     = "The shell, editor and git setup these dotfiles configure (every machine)"
mac      = "GNU tools, Mac utilities and Apple's apps (every Mac)"
dev      = "Languages, compilers, build tools and developer CLIs"
embedded = "Flashing and debugging microcontrollers (ARM, RISC-V, ESP32)"
tools    = "Command-line odds and ends: media, documents, networking, todos"
desktop  = "GUI apps for a workstation: terminal, browser, chat, notes, music"
gaming   = "Steam and voice chat"

