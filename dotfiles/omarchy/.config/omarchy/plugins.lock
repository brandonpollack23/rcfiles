# Third-party Omarchy shell plugins, one per line: id, git URL, commit.
# shell.json only names them, so `mise run plugins` clones any that are missing
# into plugins/<id> at the commit here, and fast-forwards one that's behind it.
# Each one's directory is in .gitignore, since it's its own git repo.
# After `omarchy plugin update <id>`, put its new `git rev-parse HEAD` here.
