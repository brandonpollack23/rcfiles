# ~/.config/starship.toml

format = '$username@$hostname \[$time | ${custom.utc_time}\] \[$directory\]$status ${custom.git_branch}${custom.git_status}${custom.jj}$line_break${env_var.STARSHIP_HISTCMD}$character'

[username]
show_always = true
format = "[$user]($style)"
style_user = "bold green"
style_root = "bold red"

[hostname]
disabled = false
ssh_only = false
format = "[$hostname]($style)"
style = "bold green"

[time]
disabled = false
format = "[$time]($style)"
time_format = "%I:%M:%S %p %z(%Z)"
style = "bold blue"

[directory]
format = "[$path]($style)[$read_only]($read_only_style)"
truncation_length = 5
truncate_to_repo = false
style = "bold white"

# Built-in git modules disabled; custom versions below only fire outside jj repos.
[git_branch]
disabled = true

[git_status]
disabled = true

[status]
# Success symbol is nothing (module renders empty on a zero exit);
# only a non-zero exit shows the angry-face error symbol.
disabled = false
format = "[ $symbol]($style)"
symbol = "😠"
style = "bold red"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold yellow)"
vimcmd_replace_one_symbol = "[❮](bold purple)"
vimcmd_replace_symbol = "[❮](bold purple)"
vimcmd_visual_symbol = "[❮](bold cyan)"

# History event number. zsh's $HISTCMD can't be read by starship directly
# (and %! is escaped in starship's output), so a precmd hook copies it into
# STARSHIP_HISTCMD for this env_var module to print.
[env_var.STARSHIP_HISTCMD]
format = "[$env_value ](bold green)"

[custom.utc_time]
description = "Current UTC time"
command = "date -u '+%H:%M:%S (UTC)'"
when = true
format = "[$output]($style)"
style = "bold blue"
shell = ["sh", "-c"]
use_stdin = false

[custom.git_branch]
when = "git rev-parse --is-inside-work-tree 2>/dev/null && ! jj root --ignore-working-copy 2>/dev/null"
command = "git branch --show-current 2>/dev/null"
format = "[ $output]($style) "
style = "bold purple"
shell = ["sh", "-c"]
use_stdin = false

[custom.git_status]
when = "git rev-parse --is-inside-work-tree 2>/dev/null && ! jj root --ignore-working-copy 2>/dev/null"
command = '''
git status --porcelain 2>/dev/null | awk '
  /^\?\? /     { u=1 }
  /^[MADRC]  / { s=1 }
  /^.[MADRC]/  { m=1 }
  END { if (s) printf "+"; if (m) printf "!"; if (u) printf "?" }
'
'''
format = "([$output]($style)) "
style = "bold red"
shell = ["sh", "-c"]
use_stdin = false

[custom.jj]
description = "jj repo info via starship-jj"
when = true
command = "prompt"
format = "$output"
ignore_timeout = true
shell = ["starship-jj", "--ignore-working-copy", "starship"]
use_stdin = false
