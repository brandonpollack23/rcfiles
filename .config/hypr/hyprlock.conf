# https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
# Lock screen: SUPER+SHIFT+Escape, the system menu, and hypridle (hypridle.conf).
#
# Colours follow the Hyprland theme (SUPER+F5): conf/lockscreen.lua writes the
# active palette to the file sourced below on every config load, as $<key> for
# colour options and $<key>Alpha (bare hex) for rgba($<key>Alphaee) and pango
# markup. Keys are the ones in conf/themes/default.lua. `##` is a literal `#`.
source = ~/.local/state/hypr/hyprlock.conf

$font = JetBrainsMono Nerd Font
$info = ~/.config/hypr/scripts/lock-info.sh

general {
    hide_cursor = true
    ignore_empty_input = true
    fail_timeout = 2000
}

# Parallel to the password. hyprlock talks to fprintd directly; without fprintd
# or a reader it logs a warning and $FPRINTPROMPT stays empty, so this is safe on
# every machine. install.sh installs fprintd only where it finds a reader. Don't
# add pam_fprintd to /etc/pam.d/hyprlock: it would block the password prompt.
auth {
    fingerprint {
        enabled = true
        ready_message = 󰈷  Scan finger or type your password
        present_message = 󰈷  Scanning…
    }
}

animations {
    enabled = true
    bezier = easeOut, 0.16, 1, 0.3, 1
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 4, easeOut
    animation = fadeOut, 1, 4, easeOut
    animation = inputFieldColors, 1, 3, linear
    animation = inputFieldDots, 1, 2, easeOut
}

# Blurred, darkened screenshot of the desktop; fades back to it on unlock.
background {
    monitor =
    path = screenshot
    color = $background
    blur_passes = 4
    blur_size = 12
    noise = 0.02
    contrast = 0.9
    brightness = 0.55
    vibrancy = 0.2
}

# Clock and date
label {
    monitor =
    text = $TIME
    color = $foreground
    font_size = 88
    font_family = $font ExtraBold
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba($backgroundAlphaaa)
    position = 0, 280
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %-d"
    color = $primary
    font_size = 18
    font_family = $font
    shadow_passes = 2
    shadow_color = rgba($backgroundAlphaaa)
    position = 0, 185
    halign = center
    valign = center
}

# Avatar (~/.face; nothing is drawn without one) and greeting
image {
    monitor =
    path = $avatar
    size = 110
    rounding = -1
    border_size = 3
    border_color = rgba($primaryAlphaee) rgba($secondaryAlphaee) 45deg
    position = 0, 50
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] $info greeting
    color = $foreground
    font_size = 12
    font_family = $font
    position = 0, -40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 44
    outline_thickness = 2
    rounding = 12
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true

    outer_color = rgba($primaryAlphaee) rgba($secondaryAlphaee) 45deg
    inner_color = rgba($surfaceAlphad9)
    font_color = $foreground
    font_family = $font
    check_color = rgba($warningAlphaee) rgba($secondaryAlphaee) 120deg
    fail_color = rgba($errorAlphaee) rgba($secondaryAlphaee) 40deg
    capslock_color = $warning

    placeholder_text = <span foreground="##$mutedAlpha"><i>󰌾  Password</i></span>
    check_text = <i>Checking…</i>
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fade_on_empty = false

    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba($backgroundAlphaaa)
    position = 0, -100
    halign = center
    valign = center
}

# Status lines under the field: fingerprint prompt, Caps Lock, keyboard layout
label {
    monitor =
    text = $FPRINTPROMPT
    color = $muted
    font_size = 11
    font_family = $font
    position = 0, -150
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:500] $info capslock
    color = $warning
    font_size = 11
    font_family = $font
    position = 0, -175
    halign = center
    valign = center
}

label {
    monitor =
    text = 󰌌  $LAYOUT
    color = $muted
    font_size = 10
    font_family = $font
    position = 0, -200
    halign = center
    valign = center
}

# Corners: restart hint (only after a kernel/NVIDIA update) and weather
label {
    monitor =
    text = cmd[update:300000] $info reboot
    color = $warning
    font_size = 11
    font_family = $font
    position = 40, -30
    halign = left
    valign = top
}

label {
    monitor =
    text = cmd[update:900000] $info weather
    color = $foreground
    font_size = 12
    font_family = $font
    position = -40, -30
    halign = right
    valign = top
}

label {
    monitor =
    text = cmd[update:60000] $info footer
    color = $muted
    font_size = 10
    font_family = $font
    position = 0, 30
    halign = center
    valign = bottom
}
