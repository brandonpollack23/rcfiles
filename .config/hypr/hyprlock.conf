# https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
# Catppuccin Mocha, matching the waybar pills.
general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.6
}

label {
    text = $TIME
    color = rgb(cdd6f4)
    font_size = 96
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 160
    halign = center
    valign = center
}

label {
    text = cmd[update:60000] date +"%A, %B %d"
    color = rgb(bac2de)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 60
    halign = center
    valign = center
}

input-field {
    size = 300, 50
    outline_thickness = 2
    rounding = 12
    outer_color = rgb(b4befe)
    inner_color = rgba(30, 30, 46, 0.94)
    font_color = rgb(cdd6f4)
    check_color = rgb(f9e2af)
    fail_color = rgb(f38ba8)
    placeholder_text = Password
    fail_text = $FAIL ($ATTEMPTS)
    dots_center = true
    fade_on_empty = false
    position = 0, -60
    halign = center
    valign = center
}
