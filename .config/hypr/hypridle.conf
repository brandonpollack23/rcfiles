# https://wiki.hypr.land/Hypr-Ecosystem/hypridle/
# Idle daemon, started from hyprland.lua. Dims, locks with hyprlock
# (hyprlock.conf), then turns the screens off. Never suspends on its own.

general {
    # `loginctl lock-session` (and before_sleep_cmd) run this.
    # Keep "hyprlock" in lock_cmd: inhibit_sleep's auto mode looks for it to
    # hold off suspend until the lock is actually up.
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    # Wake the screens after resume without a key press.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
    # Every lock and unlock, however the lock was started: no device sounds
    # while locked, keyboard focus back after, and the screens coming back not
    # announced as plugged in. See conf/lock.lua.
    on_lock_cmd = hyprctl repl 'require("conf.lock").locked()'
    on_unlock_cmd = hyprctl repl 'require("conf.lock").unlocked()'
}

# 1 min while locked: screens off. Covers manual locks, which would otherwise
# wait for the 10.5 min rule. Ignores inhibitors (Steam, browser media): nobody
# is watching behind the lock screen.
listener {
    timeout = 60
    ignore_inhibit = true
    on-timeout = pidof hyprlock && hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# 9.5 min: dim. No-op on desktop monitors, which brightnessctl can't drive.
listener {
    timeout = 570
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# 10 min: lock. The grace period lets a mouse nudge right after an idle lock
# dismiss it without a password; manual and before-sleep locks have none.
listener {
    timeout = 600
    on-timeout = pidof hyprlock || hyprlock --grace 5
}

# 10.5 min: screens off.
listener {
    timeout = 630
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
