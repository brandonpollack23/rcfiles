[project]
name = "brpol-waybard"
version = "0.1.0"
description = "One daemon behind every waybar taskbar, workspace and hidden-workspace button"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = []

[project.scripts]
brpol-waybard = "brpol_waybard.__main__:main"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "ruff>=0.16",
]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "brpol_waybard"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
# The daemon is fully annotated, so strict is the baseline rather than a goal.
# `uv run mypy` with no arguments checks the whole package.
strict = true
files = ["src"]
warn_unreachable = true
