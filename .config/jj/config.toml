#:schema https://docs.jj-vcs.dev/latest/config-schema.json

[user]
name = "Brandon Pollack"
email = "brandonpollack23@gmail.com"

[ui]
merge-editor = "diffview"
diff-formatter = ["difft", "--color=always", "$left", "$right"]

[ui.movement]
edit = true

[remotes.origin]
auto-track-bookmarks = "main|master|brandon/*"

[remotes.upstream]
auto-track-bookmarks = "main|master"

[merge-tools.diffconflicts]
program = "nvim"
merge-args = [
  "-c",
  "let g:jj_diffconflicts_marker_length=$marker_length",
  "-c",
  "JJDiffConflicts!",
  "$output",
  "$base",
  "$left",
  "$right",
]
merge-tool-edits-conflict-markers = true

[merge-tools.diffview]
program = "nvim"
merge-args = ["-c", "DiffviewMergeFiles $output $base $left $right"]
merge-tool-edits-conflict-markers = true
conflict-marker-style = "git"

[merge-tools.nvim-3col]
program = "nvim"
# Opens 3 vertical splits.
# $output is the file with conflict markers (center).
# $left and $right are the clean versions of each side.
merge-args = ["-d", "$left", "$output", "$right"]

[merge-tools.nvim-gitstyle]
program = "nvim"
# 1. Opens all 4 files in diff mode (-d)
# 2. Runs "wincmd J" immediately to move the first file ($output) to the bottom full-width
merge-args = [
  "-f",
  "-d",
  "$output",
  "$left",
  "$base",
  "$right",
  "-c",
  "wincmd J",
]

[aliases]
mr = ["util", "exec", "--", "jj-vine"]
# Tolerates either `main` or `master` as the base branch.
stack-marks = [
  "log",
  "-r",
  "bookmarks() & (bookmarks(\"main\") | bookmarks(\"master\"))..@",
  "--no-graph",
  "-T",
  "bookmarks.map(|b| b.name()).join(\"\\n\") ++ \"\\n\"",
]
