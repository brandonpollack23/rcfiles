# /etc/mkinitcpio.conf.d/zz_tailscale.conf
#
# Network, the SSH unlock shell and tailscale, all before the LUKS prompt.
# Omarchy's omarchy_hooks.conf sets HOOKS= outright, so this edits the list it
# leaves instead of replacing it; the zz_ prefix makes it sort (and so run)
# after Omarchy's drop-ins.
_h=()
for _x in "${HOOKS[@]}"; do
  [[ $_x == encrypt ]] && _h+=(netconf remote-unlock tailscale)
  _h+=("$_x")
done
HOOKS=("${_h[@]}")
unset _h _x
